<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b08">
  <link rel="icon" href="data:,">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #080b08;
      color: #f4e8be;
      font-family: Inter, system-ui, sans-serif;
    }
    #shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% 38%, #31452a, #101810 46%, #080b08 78%);
    }
    #unity-canvas {
      display: none;
      width: 100vw;
      height: 100dvh;
      background: #111;
      touch-action: none;
      outline: none;
    }
    .card { width: min(560px, 90vw); text-align: center; }
    .title { font-size: clamp(30px, 6vw, 58px); letter-spacing: .09em; }
    .subtitle { color: #d4c99f; line-height: 1.55; }
    .bar { height: 13px; border: 1px solid #9b8654; border-radius: 9px; padding: 2px; margin: 26px 0 12px; }
    .fill { height: 100%; width: 0; background: linear-gradient(90deg, #607b3e, #d4b86a); border-radius: 6px; transition: width .15s; }
    .error { display: none; color: #ffb4a8; line-height: 1.55; white-space: pre-wrap; }
    button {
      border: 1px solid #bca66d;
      background: #141b12;
      color: #f4e8be;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
    }
    #full { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); }
    #retry { display: none; margin: 18px auto 0; }
    @media (max-width: 700px) { #full { font-size: 13px; padding: 9px 12px; } }
  </style>
</head>
<body>
  <div id="shell">
    <div class="card">
      <div class="title">CANOPY KIN</div>
      <p class="subtitle">Moonroot is waking beneath the forest floor&hellip;</p>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div id="status">Downloading game&hellip; 0%</div>
      <div id="error" class="error"></div>
      <button id="retry" type="button">Reload game</button>
    </div>
  </div>
  <canvas id="unity-canvas" tabindex="0" aria-label="Canopy Kin game canvas"></canvas>
  <button id="full" type="button">Fullscreen</button>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const shell = document.querySelector('#shell');
    const fill = document.querySelector('#fill');
    const status = document.querySelector('#status');
    const errorBox = document.querySelector('#error');
    const retry = document.querySelector('#retry');
    const query = new URLSearchParams(location.search);
    const diagnostics = [];
    window.webglDiagnostics = diagnostics;
    const inputAcceptance = {
      canvasFocusEvents: 0,
      movementKeydowns: 0,
      focusedMovementKeydowns: 0,
      fullscreenRecoveries: 0,
      lastMovementCode: null
    };
    window.webglInputAcceptance = inputAcceptance;
    window.getWebglInputAcceptance = () => ({
      ...inputAcceptance,
      activeElement: document.activeElement === canvas ? 'canvas' : document.activeElement?.tagName || 'none',
      fullscreen: Boolean(document.fullscreenElement)
    });

    let revealed = false;
    function revealGame(instance) {
      if (instance) window.game = instance;
      if (revealed) return;
      revealed = true;
      clearTimeout(watchdog);
      shell.style.display = 'none';
      canvas.style.display = 'block';
      focusCanvas();
    }

    const record = (level, message) => {
      const line = level + ': ' + String(message);
      diagnostics.push(line);
      if (diagnostics.length > 200) diagnostics.shift();
      (level === 'error' ? console.error : console.log)(message);
      // Unity 6 can finish running the scene before createUnityInstance's
      // promise resolves when decompressionFallback is active. The runtime
      // marker is emitted only after the real mission world has been built.
      if (String(message).includes('MOONROOT_SLICE_READY')) revealGame();
    };

    const root = 'Build';
    const loader = root + '/{{{ LOADER_FILENAME }}}';
    const config = {
      dataUrl: root + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: root + '/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: root + '/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: '{{{ COMPANY_NAME }}}',
      productName: '{{{ PRODUCT_NAME }}}',
      productVersion: '{{{ PRODUCT_VERSION }}}',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true,
      autoSyncPersistentDataPath: true,
      print: message => record('log', message),
      printErr: message => record('error', message)
    };

    let watchdog;
    function fail(message) {
      if (revealed) {
        record('error', message);
        return;
      }
      clearTimeout(watchdog);
      status.style.display = 'none';
      document.querySelector('.bar').style.display = 'none';
      errorBox.style.display = 'block';
      retry.style.display = 'block';
      errorBox.textContent =
        'The colony could not load. ' + message +
        '\nRefresh the page or use a current desktop browser with WebGL and hardware acceleration enabled.';
    }

    watchdog = setTimeout(() => fail('Startup took longer than 120 seconds.'), 120000);
    window.addEventListener('error', event => fail(event.message || 'Unexpected browser error.'));
    window.addEventListener('unhandledrejection', event =>
      fail(event.reason?.message || String(event.reason || 'Unexpected startup error.')));
    retry.onclick = () => location.reload();

    const script = document.createElement('script');
    script.src = loader;
    script.onload = () => createUnityInstance(canvas, config, progress => {
      const percent = Math.round(progress * 100);
      fill.style.width = percent + '%';
      status.textContent = percent < 90
        ? 'Downloading game... ' + percent + '%'
        : 'Starting colony simulation...';
    }).then(instance => {
      revealGame(instance);
      if (query.get('movementDiagnostics') === '1')
        instance.SendMessage('Player scout ant', 'SetMovementDiagnostics', '1');
    }).catch(error => fail(error.message || String(error)));
    script.onerror = () => fail('A required game file was not found.');
    document.body.appendChild(script);

    function focusCanvas() {
      try { canvas.focus({ preventScroll: true }); }
      catch { canvas.focus(); }
    }
    canvas.addEventListener('focus', () => inputAcceptance.canvasFocusEvents++);
    canvas.addEventListener('pointerdown', focusCanvas);
    window.addEventListener('focus', focusCanvas);
    document.addEventListener('fullscreenchange', () => setTimeout(() => {
      focusCanvas();
      inputAcceptance.fullscreenRecoveries++;
    }, 0));
    window.addEventListener('keydown', event => {
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'ShiftLeft', 'ShiftRight'].includes(event.code)) {
        inputAcceptance.movementKeydowns++;
        inputAcceptance.lastMovementCode = event.code;
        if (document.activeElement === canvas) inputAcceptance.focusedMovementKeydowns++;
        event.preventDefault();
      }
    }, { passive: false });
    document.querySelector('#full').onclick = () => {
      focusCanvas();
      if (window.game) window.game.SetFullscreen(1);
      else document.documentElement.requestFullscreen?.();
    };
  </script>
</body>
</html>
