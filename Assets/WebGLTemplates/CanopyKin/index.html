<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b08;color:#f4e8be;font-family:system-ui,sans-serif}#shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#273723,#080b08 70%)}#unity-canvas{width:100%;height:100%;background:#111;display:none}.card{width:min(520px,88vw);text-align:center}.title{font-size:clamp(28px,5vw,52px);letter-spacing:.08em}.bar{height:12px;border:1px solid #9b8654;border-radius:9px;padding:2px;margin:25px 0 12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#607b3e,#d4b86a);border-radius:6px;transition:width .15s}.error{display:none;color:#ffb4a8;line-height:1.5}button{position:fixed;right:16px;bottom:16px;border:1px solid #bca66d;background:#141b12;color:#f4e8be;border-radius:8px;padding:10px 14px;cursor:pointer}
  </style>
</head>
<body><div id="shell"><div class="card"><div class="title">CANOPY KIN</div><p>Moonroot is waking beneath the forest floor…</p><div class="bar"><div id="fill" class="fill"></div></div><div id="status">Downloading game… 0%</div><div id="error" class="error"></div></div></div><canvas id="unity-canvas" tabindex="-1"></canvas><button id="full">Fullscreen</button>
<script>
const canvas=document.querySelector('#unity-canvas'),shell=document.querySelector('#shell'),fill=document.querySelector('#fill'),status=document.querySelector('#status'),errorBox=document.querySelector('#error');
const diagnostics=[];window.webglDiagnostics=diagnostics;
const record=(level,message)=>{const line=level+': '+String(message);diagnostics.push(line);if(diagnostics.length>200)diagnostics.shift();(level==='error'?console.error:console.log)(message)};
const root='Build',loader=root+'/{{{ LOADER_FILENAME }}}';
const config={dataUrl:root+'/{{{ DATA_FILENAME }}}',frameworkUrl:root+'/{{{ FRAMEWORK_FILENAME }}}',codeUrl:root+'/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}',print:message=>record('log',message),printErr:message=>record('error',message)};
function fail(message){status.style.display='none';document.querySelector('.bar').style.display='none';errorBox.style.display='block';errorBox.textContent='The colony could not load. '+message+' Refresh the page or try a current desktop browser with WebGL enabled.'}
const watchdog=setTimeout(()=>fail('Startup took longer than 90 seconds.'),90000);
window.addEventListener('error',e=>fail(e.message||'Unexpected browser error.'));
window.addEventListener('unhandledrejection',e=>fail(e.reason?.message||String(e.reason||'Unexpected startup error.')));
const script=document.createElement('script');script.src=loader;script.onload=()=>createUnityInstance(canvas,config,p=>{const n=Math.round(p*100);fill.style.width=n+'%';status.textContent=n<90?'Downloading game… '+n+'%':'Starting colony simulation…'}).then(instance=>{clearTimeout(watchdog);window.game=instance;shell.style.display='none';canvas.style.display='block';canvas.focus()}).catch(e=>fail(e.message||String(e)));script.onerror=()=>fail('A required game file was not found.');document.body.appendChild(script);
document.querySelector('#full').onclick=()=>window.game?window.game.SetFullscreen(1):document.documentElement.requestFullscreen?.();
</script></body></html>
