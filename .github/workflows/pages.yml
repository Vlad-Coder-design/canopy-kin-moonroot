name: Deploy WebGL to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed WebGL payload
        shell: bash
        run: |
          test -f Builds/WebGL/index.html
          test -f Builds/WebGL/build-manifest.json
          grep -q '"version": "0.5.1"' Builds/WebGL/build-manifest.json
          test "$(find Builds/WebGL/Build -maxdepth 1 -type f | wc -l)" -eq 4
          if find Builds/WebGL/Build -type f -size +99M | grep -q .; then
            echo "A WebGL payload exceeds GitHub's 100 MB file limit."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
